[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "people-messenger"
version = "0.1.0"
description = "Voice-aware message drafting and confirmed delivery for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
people-messenger = "people_messenger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/people_messenger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
